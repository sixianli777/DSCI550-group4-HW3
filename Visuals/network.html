<!DOCTYPE html>
<meta charset="utf-8">
<html>
<head>
  <title>Clean Haunted Places Network</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    body {
      font-family: sans-serif;
      background: #f8f8f8;
    }
    .node {
      stroke: #f8f8f8;
      stroke-width: 1.5px;
    }
    .label {
      font-size: 12px;
    }
    .legend {
      font-size: 14px;
    }
  </style>
</head>
<body>
<h2 style="margin:20px;">Clean Haunted Places Feature Network</h2>
<svg width="1200" height="800"></svg>

<script>
const width = 1200;
const height = 800;

// Define colors
const colorMap = {
  "apparition_type": "#1f77b4",   // blue
  "event_type": "#ff7f0e",        // orange
  "detected_objects": "#2ca02c"   // green
};

const svg = d3.select("svg");

// Add legend
const legendData = Object.entries(colorMap);
const legend = svg.append("g")
  .attr("class", "legend")
  .attr("transform", "translate(30,30)");

legend.selectAll("rect")
  .data(legendData)
  .join("rect")
    .attr("x", 0)
    .attr("y", (_, i) => i * 25)
    .attr("width", 18)
    .attr("height", 18)
    .attr("fill", d => d[1]);

legend.selectAll("text")
  .data(legendData)
  .join("text")
    .attr("x", 25)
    .attr("y", (_, i) => i * 25 + 14)
    .text(d => d[0]);

// Load JSON
d3.json("../Data/network_cleaned_unweighted.json").then(data => {
  const nodes = data.nodes.map(d => Object.assign({}, d));
  const links = data.links.map(d => Object.assign({}, d));

  // Force simulation
  const simulation = d3.forceSimulation(nodes)
    .force("link", d3.forceLink(links).id(d => d.id).distance(120))
    .force("charge", d3.forceManyBody().strength(-500))
    .force("center", d3.forceCenter(width / 2, height / 2));

  // Edges
  const link = svg.append("g")
      .attr("stroke", "#aaa")
      .attr("stroke-opacity", 0.4)
    .selectAll("line")
    .data(links)
    .join("line")
      .attr("stroke-width", 1);

  // Nodes
  const node = svg.append("g")
    .selectAll("circle")
    .data(nodes)
    .join("circle")
      .attr("r", 8)
      .attr("fill", d => colorMap[d.group] || "#999")
      .call(drag(simulation));

  // Labels
  const label = svg.append("g")
    .selectAll("text")
    .data(nodes)
    .join("text")
      .attr("class", "label")
      .text(d => d.name)
      .attr("dy", "-0.9em");

  // Tick updates
  simulation.on("tick", () => {
    link
      .attr("x1", d => d.source.x)
      .attr("y1", d => d.source.y)
      .attr("x2", d => d.target.x)
      .attr("y2", d => d.target.y);

    node
      .attr("cx", d => d.x)
      .attr("cy", d => d.y);

    label
      .attr("x", d => d.x)
      .attr("y", d => d.y);
  });

  // Drag behavior
  function drag(simulation) {
    return d3.drag()
      .on("start", (event, d) => {
        if (!event.active) simulation.alphaTarget(0.3).restart();
        d.fx = d.x;
        d.fy = d.y;
      })
      .on("drag", (event, d) => {
        d.fx = event.x;
        d.fy = event.y;
      })
      .on("end", (event, d) => {
        if (!event.active) simulation.alphaTarget(0);
        d.fx = null;
        d.fy = null;
      });
  }
});
</script>
</body>
</html>
